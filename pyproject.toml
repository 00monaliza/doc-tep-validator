[project]
name = "doc-tep-validator"
version = "0.1.0"
description = "Извлечение и кросс-проверка ТЭП в текстовых разделах проектной документации (RU/KZ)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "easyocr>=1.7.2",
    "faker>=40.39.0",
    "fastapi>=0.141.1",
    "fpdf2>=2.8.8",
    "natasha>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "reportlab>=5.0.1",
    "scikit-learn>=1.9.1",
    "setuptools<81",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
