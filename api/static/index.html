<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ТЭП-валидатор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Fira+Sans+Condensed:wght@400;500;600&display=swap&subset=cyrillic-ext" rel="stylesheet">
<style>
  :root {
    --tracing: #E9EEEA;   /* калька */
    --sheet: #F8FAF7;     /* лист */
    --graphite: #26302F;
    --graphite-2: #55615E;
    --rule: #9AA7A2;
    --pencil: #B3122E;    /* красный карандаш эксперта */
    --pencil-wash: #F6E3E6;
    --stamp: #2E3A8C;     /* чернила печати */
    --stamp-wash: #E4E7F4;
    --amber: #8A5A00;
    --amber-wash: #F5EBD6;
    --focus: #2E3A8C;
    --cond: "Fira Sans Condensed", "Arial Narrow", sans-serif;
    --body: "Fira Sans", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--tracing); color: var(--graphite); font: 15px/1.5 var(--body); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- основная надпись ---------- */
  .stamp { display: grid; grid-template-columns: minmax(220px, 2.2fr) repeat(4, minmax(110px, 1fr));
           border: 2px solid var(--graphite); background: var(--sheet); margin: 16px; }
  .stamp > div { border-left: 1px solid var(--graphite); padding: 6px 10px 8px; min-width: 0; }
  .stamp > div:first-child { border-left: 0; }
  .stamp small { display: block; font: 500 11px/1.3 var(--cond); color: var(--graphite-2); }
  .stamp strong { display: block; font: 600 17px/1.3 var(--cond); overflow-wrap: anywhere; }
  .stamp .title strong { font-size: 19px; }
  .stamp .bad strong { color: var(--pencil); }
  .stamp .ok strong { color: var(--stamp); }

  main { display: grid; grid-template-columns: minmax(340px, 38%) 1fr; gap: 16px; padding: 0 16px 16px;
         height: calc(100% - 110px); min-height: 520px; }
  .panel { background: var(--sheet); border: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; min-width: 0; }

  /* ---------- вкладки ---------- */
  .tabs { display: flex; border-bottom: 1px solid var(--rule); }
  .tabs button { flex: 1; background: none; border: 0; border-right: 1px solid var(--rule); padding: 10px 8px;
                 font: 500 14px var(--cond); cursor: pointer; color: var(--graphite-2); }
  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-selected="true"] { color: var(--graphite); box-shadow: inset 0 -3px 0 var(--graphite); }
  .tabs .count { font-weight: 600; margin-left: 4px; }
  .tabpanel { overflow: auto; flex: 1; }

  /* ---------- реестр замечаний ---------- */
  ol.register { list-style: none; margin: 0; padding: 0; counter-reset: remark; }
  ol.register li { border-bottom: 1px solid var(--rule); }
  .remark { display: grid; grid-template-columns: 34px 1fr; gap: 0 10px; width: 100%; text-align: left;
            background: none; border: 0; padding: 12px 14px 12px 10px; cursor: pointer; }
  .remark:hover { background: #EFF3EF; }
  .remark[aria-current="true"] { background: var(--pencil-wash); }
  .remark .no { font: 600 13px/1.6 var(--cond); color: var(--graphite-2); }
  .remark .what { font-weight: 500; }
  .remark .values { font: 500 15px var(--cond); margin-top: 2px; }
  .remark .values .ne { color: var(--pencil); padding: 0 6px; }
  .remark .meta { font-size: 13px; color: var(--graphite-2); }
  .verdict { display: inline-block; font: 600 12px/1 var(--cond); padding: 3px 6px; border: 1px solid; margin-right: 6px; }
  .v-MISMATCH { color: var(--pencil); border-color: var(--pencil); }
  .v-MISSING { color: var(--amber); border-color: var(--amber); background: var(--amber-wash); }
  .v-MATCH { color: var(--stamp); border-color: var(--stamp); }
  .matches summary { padding: 10px 14px; cursor: pointer; color: var(--graphite-2); font: 500 14px var(--cond); }

  /* ---------- ТЭП и комплектность ---------- */
  table.grid { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.grid caption { text-align: left; padding: 12px 14px 6px; font: 600 15px var(--cond); }
  table.grid th, table.grid td { border-bottom: 1px solid var(--rule); padding: 6px 14px; text-align: left; vertical-align: top; }
  table.grid th { font: 500 12px var(--cond); color: var(--graphite-2); }
  table.grid td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.grid tr.clickable { cursor: pointer; }
  table.grid tr.clickable:hover td { background: #EFF3EF; }
  .sheet-list { list-style: none; margin: 0; padding: 8px 14px; }
  .sheet-list li { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
  .sheet-list .code { font: 600 15px var(--cond); }
  .present { color: var(--stamp); font: 500 13px var(--cond); }
  .absent { color: var(--pencil); font: 500 13px var(--cond); }
  .note { margin: 10px 14px; padding: 8px 10px; border-left: 3px solid var(--amber); background: var(--amber-wash); font-size: 14px; }

  /* ---------- лист документа ---------- */
  .viewer-head { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .viewer-head .doc { font: 600 15px var(--cond); margin-right: auto; overflow-wrap: anywhere; }
  .refs button { background: var(--sheet); border: 1px solid var(--rule); padding: 4px 10px; cursor: pointer; font: 500 13px var(--cond); }
  .refs button[aria-pressed="true"] { border-color: var(--graphite); background: var(--graphite); color: var(--sheet); }
  .evidence { padding: 8px 12px; font-size: 14px; color: var(--graphite-2); border-bottom: 1px solid var(--rule); }
  .evidence mark { background: none; color: var(--pencil); font-weight: 600; }
  .canvas-wrap { flex: 1; overflow: auto; padding: 16px; background: #DDE3DF; }
  .page { position: relative; margin: 0 auto; box-shadow: 0 0 0 1px var(--rule); background: #fff; width: fit-content; }
  .page canvas { display: block; }
  .pencil-ring { position: absolute; border: 2.5px solid var(--pencil); border-radius: 46% 54% 48% 52% / 58% 44% 56% 42%;
                 transform: rotate(-2deg); pointer-events: none; }
  @media (prefers-reduced-motion: no-preference) {
    .pencil-ring { animation: draw .45s ease-out; }
    @keyframes draw { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  }

  /* ---------- приём пакета ---------- */
  .intake { max-width: 640px; margin: 8vh auto; padding: 0 16px; }
  .intake h1 { font: 600 30px/1.2 var(--cond); margin: 0 0 8px; }
  .intake p { margin: 0 0 20px; color: var(--graphite-2); max-width: 60ch; }
  .drop { display: block; border: 2px dashed var(--graphite-2); background: var(--sheet); padding: 36px 20px; text-align: center; cursor: pointer; }
  .drop.over { border-color: var(--stamp); background: var(--stamp-wash); }
  .drop strong { display: block; font: 600 18px var(--cond); margin-bottom: 4px; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .demo { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--graphite-2); font-size: 14px; }
  .demo button, .again { background: var(--sheet); border: 1px solid var(--graphite); padding: 6px 12px; cursor: pointer; font: 500 14px var(--cond); }
  .status { margin-top: 18px; font: 500 15px var(--cond); }
  .status.error { color: var(--pencil); }
  .empty { padding: 24px 14px; color: var(--graphite-2); }
  .hidden { display: none !important; }

  @media (max-width: 900px) {
    .stamp { grid-template-columns: 1fr 1fr; }
    .stamp > div { border-left: 0; border-top: 1px solid var(--graphite); }
    .stamp > div.title { grid-column: 1 / -1; border-top: 0; }
    main { grid-template-columns: minmax(0, 1fr); height: auto; }
    .panel.list { max-height: 60vh; }
    .canvas-wrap { min-height: 60vh; }
  }
</style>
</head>
<body>

<section class="intake" id="intake" aria-labelledby="intake-title">
  <h1 id="intake-title">Сверка ТЭП между разделами проекта</h1>
  <p>Загрузите пояснительную записку, текстовую часть АР и КР и сметную документацию на русском или казахском языке. Сервис найдёт технико-экономические показатели и покажет, где разделы расходятся.</p>
  <label class="drop" id="drop">
    <strong>Выберите файлы или перетащите их сюда</strong>
    <span>PDF или DOCX, до 20 файлов по 50 МБ</span>
    <input type="file" id="file-input" multiple accept=".pdf,.docx">
  </label>
  <div class="demo">
    <span>Нет своих документов?</span>
    <button type="button" data-demo="ru">Пример на русском</button>
    <button type="button" data-demo="kz">Қазақша мысал</button>
    <button type="button" data-demo="kz" data-kind="scan">Пример-скан</button>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</section>

<div id="app" class="hidden">
  <header class="stamp" id="stamp"></header>
  <main>
    <section class="panel list" aria-label="Результаты проверки">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-findings" aria-controls="p-findings" aria-selected="true">Замечания<span class="count" id="c-findings"></span></button>
        <button role="tab" id="tab-tep" aria-controls="p-tep" aria-selected="false">ТЭП</button>
        <button role="tab" id="tab-compl" aria-controls="p-compl" aria-selected="false">Комплектность<span class="count" id="c-compl"></span></button>
      </div>
      <div class="tabpanel" role="tabpanel" id="p-findings" aria-labelledby="tab-findings"></div>
      <div class="tabpanel hidden" role="tabpanel" id="p-tep" aria-labelledby="tab-tep"></div>
      <div class="tabpanel hidden" role="tabpanel" id="p-compl" aria-labelledby="tab-compl"></div>
    </section>
    <section class="panel" aria-label="Документ">
      <div class="viewer-head">
        <span class="doc" id="doc-name">Выберите замечание слева</span>
        <span class="refs" id="refs"></span>
      </div>
      <div class="evidence hidden" id="evidence"></div>
      <div class="canvas-wrap" id="canvas-wrap"><div class="page" id="page"></div></div>
    </section>
  </main>
</div>

<script type="module">
import * as pdfjs from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

const SECTION = { PZ: "ПЗ", AR: "АР", KR: "КР", SMETA: "Смета" };
const SECTION_FULL = { PZ: "Пояснительная записка", AR: "Архитектурные решения", KR: "Конструктивные решения", SMETA: "Сметная документация" };
const VERDICT = { MISMATCH: "Расхождение", MISSING: "Нет значения", MATCH: "Совпадает" };
const FIELD = {
  floors: "Этажность", building_area_m2: "Площадь застройки, м²", total_area_m2: "Общая площадь, м²",
  construction_volume_m3: "Строительный объём, м³", underground_volume_m3: "в т. ч. подземной части, м³",
  estimated_cost_ktg: "Сметная стоимость, тыс. тенге", construction_duration_months: "Продолжительность, мес.",
  explication_total_area_m2: "Итого по экспликации, м²", concrete_total_m3: "Расход бетона всего, м³",
  concrete_b25_foundation_m3: "Бетон B25, м³", concrete_b30_frame_m3: "Бетон B30, м³", rebar_a500c_t: "Арматура A500С, т",
  brick_masonry_m3: "Кирпичная кладка, м³", steel_structures_t: "Стальные конструкции, т",
  "os.total_ktg": "Итого по объектной смете, тыс. тенге", "ssr.total_ktg": "Всего по ССР, тыс. тенге",
  "local.total_tg": "Всего по локальной смете, тенге",
};
const fieldName = f => FIELD[f] ?? FIELD[f.replace("local_qty.", "")]?.replace(/^/, "ЛС: ")
  ?? (f.startsWith("ssr.ch2.os_") ? `Строка ОС ${f.slice(11, 16)} в ССР, тыс. тенге` : f);
const fmt = v => v == null ? "—" : Number(v).toLocaleString("ru-RU", { maximumFractionDigits: 3 });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let check = null, report = null, pdfCache = {};

// ---------- intake ----------
const drop = $("drop"), input = $("file-input");
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => upload(ev.dataTransfer.files));
input.addEventListener("change", () => upload(input.files));
document.querySelectorAll("[data-demo]").forEach(b => b.addEventListener("click", () =>
  start(fetch(`/api/demo/${b.dataset.demo}?kind=${b.dataset.kind ?? "text"}`, { method: "POST" }), b.dataset.kind === "scan")));

function upload(files) {
  if (!files.length) return;
  const fd = new FormData();
  [...files].forEach(f => fd.append("files", f));
  start(fetch("/api/checks", { method: "POST", body: fd }), false);
}

async function start(req, slow) {
  const status = $("status");
  status.className = "status";
  status.textContent = slow ? "Распознаём сканы, это займёт до минуты…" : "Проверяем документы…";
  const r = await req;
  const body = await r.json();
  if (!r.ok) { status.className = "status error"; status.textContent = body.detail ?? "Файлы не приняты."; return; }
  for (;;) {
    await new Promise(res => setTimeout(res, 800));
    const s = await (await fetch(`/api/checks/${body.id}`)).json();
    if (s.status === "done") { check = body.id; report = s.report; render(); return; }
    if (s.status === "error") { status.className = "status error"; status.textContent = `Проверка не выполнена: ${s.error}`; return; }
  }
}

// ---------- report ----------
function render() {
  $("intake").classList.add("hidden");
  $("app").classList.remove("hidden");
  const bad = report.findings.filter(f => f.verdict !== "MATCH");
  const c = report.completeness;
  const lang = { ru: "русский", kz: "казахский", mixed: "смешанный" }[report.lang] ?? report.lang;
  $("stamp").innerHTML = `
    <div class="title"><small>Проверка пакета</small><strong>${esc(report.documents.length)} файл(ов), язык: ${esc(lang)}</strong></div>
    <div class="${c.missing.length ? "bad" : "ok"}"><small>Разделы</small><strong>${c.present.length} из ${c.required.length}</strong></div>
    <div class="${report.summary.MISMATCH ? "bad" : "ok"}"><small>Расхождения</small><strong>${report.summary.MISMATCH}</strong></div>
    <div class="${report.summary.MISSING ? "bad" : "ok"}"><small>Нет значения</small><strong>${report.summary.MISSING}</strong></div>
    <div><small>Совпало проверок</small><strong>${report.summary.MATCH}</strong></div>`;
  $("c-findings").textContent = bad.length;
  $("c-compl").textContent = c.missing.length ? `−${c.missing.length}` : "";
  renderFindings(bad);
  renderTep();
  renderCompleteness();
  document.querySelectorAll('[role="tab"]').forEach(t => t.addEventListener("click", () => selectTab(t)));
  const first = document.querySelector(".remark");
  if (first) first.click();
}

function selectTab(tab) {
  document.querySelectorAll('[role="tab"]').forEach(t => {
    const on = t === tab;
    t.setAttribute("aria-selected", on);
    $(t.getAttribute("aria-controls")).classList.toggle("hidden", !on);
  });
}

function remarkHtml(f, i) {
  const [a, b] = f.refs;
  const values = f.verdict === "MISSING"
    ? `${SECTION[a.section]}: —<span class="ne">·</span>${SECTION[b.section]}: ${fmt(b.value)}`
    : `${fmt(a.value)}<span class="ne">${f.verdict === "MATCH" ? "=" : "≠"}</span>${fmt(b.value)}`;
  const rel = f.delta_rel != null && f.verdict === "MISMATCH" ? `, ${(f.delta_rel * 100).toFixed(1).replace(".", ",")} %` : "";
  return `<li><button class="remark" data-i="${i}">
    <span class="no">${i + 1}</span>
    <span><span class="verdict v-${f.verdict}">${VERDICT[f.verdict]}</span><span class="what">${esc(fieldName(f.field))}</span>${f.low_confidence ? ` <span class="verdict v-MISSING">скан</span>` : ""}
      <div class="values">${values}</div>
      <div class="meta">${SECTION[a.section]} ↔ ${SECTION[b.section]}${rel}</div>
      ${f.notes.map(n => `<div class="meta">${esc(n)}</div>`).join("")}
    </span></button></li>`;
}

function renderFindings(bad) {
  const ok = report.findings.filter(f => f.verdict === "MATCH");
  const all = [...bad, ...ok];
  const p = $("p-findings");
  p.innerHTML = (report.warnings ?? []).map(w => `<div class="note">${esc(w)}</div>`).join("")
    + (bad.length ? `<ol class="register">${bad.map((f, i) => remarkHtml(f, i)).join("")}</ol>`
                  : `<div class="empty">Расхождений между разделами не найдено.</div>`)
    + (ok.length ? `<details class="matches"><summary>Совпавшие проверки: ${ok.length}</summary>
        <ol class="register">${ok.map((f, i) => remarkHtml(f, bad.length + i)).join("")}</ol></details>` : "");
  p.querySelectorAll(".remark").forEach(btn => btn.addEventListener("click", () => {
    p.querySelectorAll(".remark").forEach(x => x.removeAttribute("aria-current"));
    btn.setAttribute("aria-current", "true");
    showFinding(all[+btn.dataset.i]);
  }));
}

function renderTep() {
  const order = ["PZ", "AR", "KR", "SMETA"];
  $("p-tep").innerHTML = order.filter(s => report.tep[s]).map(s => {
    const rows = Object.entries(report.tep[s]).filter(([f]) => !f.startsWith("room."));
    const rooms = Object.keys(report.tep[s]).filter(f => f.startsWith("room.")).length;
    return `<table class="grid"><caption>${SECTION_FULL[s]}${rooms ? ` · помещений в экспликации: ${rooms}` : ""}</caption>
      <thead><tr><th>Показатель</th><th class="num">Значение</th><th>Где</th></tr></thead><tbody>
      ${rows.map(([f, e]) => `<tr class="clickable" data-s="${s}" data-f="${esc(f)}" tabindex="0">
        <td>${esc(fieldName(f))}</td><td class="num">${esc(e.raw)}</td><td>${e.page ? `стр. ${e.page}` : "—"}</td></tr>`).join("")}
      </tbody></table>`;
  }).join("") || `<div class="empty">Показатели не найдены.</div>`;
  $("p-tep").querySelectorAll("tr.clickable").forEach(tr => {
    const go = () => showRefs([{ ...report.tep[tr.dataset.s][tr.dataset.f], section: tr.dataset.s, field: tr.dataset.f }]);
    tr.addEventListener("click", go);
    tr.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  });
}

function renderCompleteness() {
  const c = report.completeness;
  const byS = Object.fromEntries(report.documents.filter(d => d.section).map(d => [d.section, d]));
  $("p-compl").innerHTML = `<ul class="sheet-list">${c.required.map(s => `<li>
      <span class="code">${SECTION[s]}</span><span>${SECTION_FULL[s]}${byS[s] ? `<br><small>${esc(byS[s].file)}${byS[s].ocr ? " (скан)" : ""}</small>` : ""}</span>
      ${byS[s] ? `<span class="present">загружен</span>` : `<span class="absent">нет в пакете</span>`}</li>`).join("")}</ul>`
    + c.unrecognised.map(f => `<div class="note">${esc(f)}: раздел не определён.</div>`).join("")
    + c.duplicates.map(f => `<div class="note">${esc(f)}: второй документ того же раздела не учитывался.</div>`).join("");
}

// ---------- viewer ----------
let currentRefs = [];
function showFinding(f) { showRefs(f.refs, f); }

function showRefs(refs, finding) {
  currentRefs = refs;
  $("refs").innerHTML = refs.length > 1 ? refs.map((r, i) =>
    `<button type="button" aria-pressed="${i === 0}" data-i="${i}">${SECTION[r.section]}${r.value == null ? " (нет)" : ""}</button>`).join(" ") : "";
  $("refs").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    $("refs").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    showRef(currentRefs[+b.dataset.i], finding);
  }));
  const firstPresent = refs.findIndex(r => r.value != null);
  showRef(refs[0].value == null && firstPresent >= 0 ? refs[firstPresent] : refs[0], finding);
  if (refs.length > 1 && refs[0].value == null && firstPresent >= 0)
    $("refs").querySelectorAll("button").forEach((x, i) => x.setAttribute("aria-pressed", i === firstPresent));
}

async function showRef(ref, finding) {
  const doc = report.documents.find(d => d.section === ref.section);
  const ev = $("evidence");
  $("doc-name").textContent = doc ? `${SECTION[ref.section]} · ${doc.file}` : `${SECTION_FULL[ref.section]}: нет в пакете`;
  if (ref.value == null) {
    ev.innerHTML = `${esc(finding?.message ?? "")} В документе этого значения нет.`;
  } else {
    const txt = esc(ref.evidence ?? "");
    const raw = esc(ref.raw ?? "");
    ev.innerHTML = (ref.derived ? `Вычислено: ${esc(ref.derived)}. ` : "") + (raw && txt.includes(raw) ? txt.replace(raw, `<mark>${raw}</mark>`) : txt);
  }
  ev.classList.remove("hidden");
  const page = $("page");
  page.innerHTML = "";
  if (!doc || !doc.file.toLowerCase().endsWith(".pdf")) {
    page.innerHTML = `<div class="empty">${doc ? "Для DOCX показываем только фрагмент текста выше." : ""}</div>`;
    return;
  }
  const url = `/api/checks/${check}/files/${encodeURIComponent(doc.file)}`;
  pdfCache[url] ??= pdfjs.getDocument(url).promise;
  const pdf = await pdfCache[url];
  const p = await pdf.getPage(ref.page ?? 1);
  const width = $("canvas-wrap").clientWidth - 32;
  const base = p.getViewport({ scale: 1 });
  const scale = Math.min(2, width / base.width);
  const vp = p.getViewport({ scale });
  const ratio = window.devicePixelRatio || 1;
  const canvas = document.createElement("canvas");
  canvas.width = vp.width * ratio; canvas.height = vp.height * ratio;
  canvas.style.width = `${vp.width}px`; canvas.style.height = `${vp.height}px`;
  page.appendChild(canvas);
  await p.render({ canvasContext: canvas.getContext("2d"), viewport: vp, transform: [ratio, 0, 0, ratio, 0, 0] }).promise;
  if (ref.bbox) {
    const [x0, top, x1, bottom] = ref.bbox, pad = 5;
    const ring = document.createElement("div");
    ring.className = "pencil-ring";
    Object.assign(ring.style, { left: `${x0 * scale - pad}px`, top: `${top * scale - pad}px`,
      width: `${(x1 - x0) * scale + 2 * pad}px`, height: `${(bottom - top) * scale + 2 * pad}px` });
    page.appendChild(ring);
    const wrap = $("canvas-wrap");  // scroll only the document pane, never the whole window
    wrap.scrollTop = Math.max(0, page.offsetTop + top * scale - wrap.clientHeight / 2);
  }
}
</script>
</body>
</html>
